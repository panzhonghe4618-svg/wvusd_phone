<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>WVUSD 作业之战</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center; overflow: hidden;

      font-family: "Microsoft YaHei", system-ui, sans-serif;
    }
    #game-wrap { position: fixed; inset: 0; width: 100vw; height: 100vh; height: 100dvh; }
    canvas { display: block; width: 100%; height: 100%; border: 0; border-radius: 0; box-shadow: none; background: #101827; touch-action: none; }
    #hud { position:absolute; inset: 17px 24px auto; pointer-events:none; display:flex; justify-content:space-between; align-items:flex-start; gap:20px; }
    #boss-card { width: min(46vw, 390px); text-align:center; }

    #health-fill { height:100%; width:100%; background:linear-gradient(90deg,#ff3030,#d70013); transition:width .16s; }
    #health-text { color:white; font-size:13px; font-weight:bold; margin-top:3px; text-shadow:1px 1px #000; }
    #tip { max-width:310px; color:#fff; background:#000a; border:2px solid #687c9d; padding:8px 11px; border-radius:8px; font-size:13px; line-height:1.4; text-shadow:1px 1px #000; }
    #classroom-toast { position:absolute; z-index:3; top:92px; left:50%; transform:translate(-50%,-10px); width:min(90vw,520px); padding:13px 18px; border:2px solid #8ab8ff; border-radius:12px; color:#fff; text-align:center; font-weight:800; background:linear-gradient(135deg,#183e66ee,#15213fee); box-shadow:0 8px 28px #0009; opacity:0; pointer-events:none; transition:opacity .2s,transform .2s; }
    #classroom-toast.show { opacity:1; transform:translate(-50%,0); }
    #goguardian-toast { position:absolute; z-index:4; top:152px; left:50%; transform:translate(-50%,-8px); width:min(92vw,600px); padding:10px 15px; border:2px solid #a43b47; border-radius:9px; color:#ffd8dc; text-align:center; font-size:14px; font-weight:900; letter-spacing:.02em; background:linear-gradient(100deg,#270b10ed,#481018f2,#270b10ed); box-shadow:0 0 7px #ff344955,inset 0 0 9px #ff253322; opacity:0; pointer-events:none; transition:opacity .18s,transform .18s; }
    #goguardian-toast.show { opacity:1; transform:translate(-50%,0); }
    #overlay { position:absolute; inset:0; display:grid; place-items:center; background:#050913b8; border-radius:12px; text-align:center; }
    #panel { width:min(82%, 450px); padding:25px; background:linear-gradient(#233a5b,#101827); border:3px solid #96b7e4; border-radius:15px; box-shadow:0 8px 35px #000; color:white; }
    #panel h1 { margin:0 0 10px; font-size:clamp(24px,4vw,38px); }
    #panel p { margin:8px 0 18px; line-height:1.55; }
    button { padding:10px 26px; font:800 17px "Microsoft YaHei",sans-serif; color:white; cursor:pointer; border:3px solid #060606; border-radius:7px; background:#bd1c28; box-shadow:inset 0 0 0 2px #f66, 2px 3px 0 #000; }
    #power-mode.selected { background:#9a4bd1; box-shadow:inset 0 0 0 2px #e3b7ff,0 0 15px #cf72ff88; }

    #ultimate-toast.show { opacity:1;transform:translate(-50%,0); }
    #touch-controls { display:none; position:absolute; inset:0; z-index:6; pointer-events:none; }
    #touch-pad { position:absolute; left:max(18px,env(safe-area-inset-left)); bottom:max(22px,env(safe-area-inset-bottom)); display:grid; grid-template-columns:repeat(3,86px); grid-template-rows:66px 66px; gap:0; pointer-events:auto; touch-action:none; filter:drop-shadow(0 5px 14px #0006); }
    .touch-key { display:grid; place-items:center; min-width:0; margin:0; padding:0; border:1px solid #ffffff9c; border-radius:0; color:#fff; font:900 26px system-ui,sans-serif; background:linear-gradient(145deg,#ffffff35,#b9d9ff13); box-shadow:inset 0 1px 1px #ffffff55; backdrop-filter:blur(12px) saturate(150%); -webkit-backdrop-filter:blur(12px) saturate(150%); touch-action:none; user-select:none; -webkit-user-select:none; }
    .touch-key:active,.touch-key.pressed { background:linear-gradient(145deg,#8bd6ff75,#526caa55); }
    #touch-up { grid-area:1/2; border-left:0;border-right:0;border-radius:0; }
    #touch-left { grid-area:1/1;border-radius:30px 0 0 30px; }
    #touch-right { grid-area:1/3;border-radius:0 30px 30px 0; }
    #touch-down { grid-area:2/2;border-radius:0 0 30px 30px; }
    #touch-space { position:absolute; right:max(24px,env(safe-area-inset-right)); bottom:max(38px,env(safe-area-inset-bottom)); width:96px; height:96px; border-radius:50%; font-size:17px; pointer-events:auto; }
    #touch-space[hidden] { display:none; }
    #touch-controls.active { display:block; }
    button:not(.touch-key):hover { filter:brightness(1.16); transform:translateY(-1px); }
    @media (max-width:650px) { #hud { inset:10px 12px auto; } #tip { display:none; } #boss-card { width:64vw; } #health-frame{ height:24px; } }
  </style>
</head>
<body>
  <main id="game-wrap" aria-label="WVUSD 作业之战游戏">

      <button id="touch-space" class="touch-key" type="button" data-key=" " aria-label="长按空格发射" hidden>空格</button>

  </main>

    const player = { x: W / 2, y: H - 95, r: 19, speed: 315, flash: 0, rotation: 0, rolling: 0, rollCooldown: 0, rollX: 0, rollY: 0, defending: false, trails: [], trailClock: 0 };

    const bulletColors = ['#ef233c', '#f77f00', '#ffd60a', '#38b000', '#00b8c8', '#2878e6', '#823bd2'];
    const bulletSprites = new Map();

    addEventListener('keydown', e => { if (["ArrowLeft","ArrowRight","ArrowUp","ArrowDown"," "].includes(e.key)) e.preventDefault(); if(e.key==='ArrowLeft'||e.key==='a'||e.key==='A')lastRollDir=-1;else if(e.key==='ArrowRight'||e.key==='d'||e.key==='D')lastRollDir=1;if(running){keys.add(e.key);startRollIfChord();} });
    addEventListener('keyup', e => keys.delete(e.key));
    addEventListener('blur', () => keys.clear());
    document.addEventListener('visibilitychange', () => keys.clear());
    const touchPad=document.querySelector('#touch-pad'), touchPointerKeys=new Map(), touchChordKeys=new Map();
    function releaseOppositeTouch(pointerId,key){
      if(key!=='ArrowLeft'&&key!=='ArrowRight')return;
      const opposite=key==='ArrowLeft'?'ArrowRight':'ArrowLeft';
      for(const [otherId,primary] of [...touchPointerKeys]){
        if(otherId!==pointerId&&(primary===opposite||touchChordKeys.get(otherId)===opposite))setTouchKey(otherId,null);
      }
    }
    function setTouchKey(pointerId,button){
      const previous=touchPointerKeys.get(pointerId), chord=touchChordKeys.get(pointerId), next=button?.dataset.key;
      if(previous===next&&!chord)return;
      if(previous){keys.delete(previous);touchPad.querySelector(`[data-key="${previous}"]`)?.classList.remove('pressed');}
      if(chord){keys.delete(chord);touchPad.querySelector(`[data-key="${chord}"]`)?.classList.remove('pressed');touchChordKeys.delete(pointerId);}
      if(next){releaseOppositeTouch(pointerId,next);if(next==='ArrowLeft')lastRollDir=-1;else if(next==='ArrowRight')lastRollDir=1;keys.add(next);button.classList.add('pressed');touchPointerKeys.set(pointerId,next);startRollIfChord();}
      else touchPointerKeys.delete(pointerId);
    }
    const touchOrigins=new Map();
    touchPad.addEventListener('pointerdown',e=>{const button=e.target.closest('.touch-key');if(!button)return;e.preventDefault();touchPad.setPointerCapture(e.pointerId);touchOrigins.set(e.pointerId,{x:e.clientX,y:e.clientY});setTouchKey(e.pointerId,button);});
    touchPad.addEventListener('pointermove',e=>{
      if(!touchPointerKeys.has(e.pointerId))return;
      const origin=touchOrigins.get(e.pointerId);if(!origin||Math.hypot(e.clientX-origin.x,e.clientY-origin.y)<16)return;
      const button=document.elementFromPoint(e.clientX,e.clientY)?.closest('.touch-key');if(!button||!touchPad.contains(button))return;
      const primary=touchPointerKeys.get(e.pointerId), chord=touchChordKeys.get(e.pointerId), next=button.dataset.key;
      const horizontal=k=>k==='ArrowLeft'||k==='ArrowRight';
      if(chord){
        if(next===primary){keys.delete(chord);touchPad.querySelector(`[data-key="${chord}"]`)?.classList.remove('pressed');touchChordKeys.delete(e.pointerId);}
        else if(next!==chord&&((primary==='ArrowUp'&&horizontal(next))||(chord==='ArrowUp'&&horizontal(next)))){
          keys.delete(chord);touchPad.querySelector(`[data-key="${chord}"]`)?.classList.remove('pressed');releaseOppositeTouch(e.pointerId,next);if(next==='ArrowLeft')lastRollDir=-1;else if(next==='ArrowRight')lastRollDir=1;keys.add(next);button.classList.add('pressed');touchChordKeys.set(e.pointerId,next);startRollIfChord();

      } else if((primary==='ArrowUp'&&horizontal(next))||(horizontal(primary)&&next==='ArrowUp')){
        if(next!==primary){releaseOppositeTouch(e.pointerId,next);if(next==='ArrowLeft')lastRollDir=-1;else if(next==='ArrowRight')lastRollDir=1;keys.add(next);button.classList.add('pressed');touchChordKeys.set(e.pointerId,next);startRollIfChord();}

    const releaseTouch=e=>{if(!touchPointerKeys.has(e.pointerId))return;e.preventDefault();setTouchKey(e.pointerId,null);touchOrigins.delete(e.pointerId);};

    touchSpace.addEventListener('pointerdown',e=>{e.preventDefault();keys.add(' ');touchSpace.classList.add('pressed');touchSpace.setPointerCapture(e.pointerId);});
    const releaseSpace=e=>{e.preventDefault();keys.delete(' ');touchSpace.classList.remove('pressed');};
    touchSpace.addEventListener('pointerup',releaseSpace);touchSpace.addEventListener('pointercancel',releaseSpace);touchSpace.addEventListener('lostpointercapture',releaseSpace);

    function start() {
      hp = maxHp = powerMode?500:100; bullets = []; sparks = []; ultimateShots=[]; reflectedCount=0; ultimateUnlocked=false; ultimateActive=false; ultimateShotClock=0; attackClock = powerMode?.125:.25; toastClock = 2; classroomToast.classList.remove('show');ultimateToast.classList.remove('show'); running = true; last = performance.now(); keys.clear();

    function fireRing() {
      // Normal mode uses an 80° fan; power mode narrows it to 40°.
      const halfAngle = powerMode ? 20 : 40;
      const offset = (Math.random() * 2 - 1) * halfAngle * Math.PI / 180;
      const angle = Math.PI / 2 + offset;
      bullets.push({ x: boss.x + Math.cos(angle) * 61, y: boss.y + 63, vx: Math.cos(angle) * 200, vy: Math.sin(angle) * 200, speed:200, r: 15, returned: false, dead: false, color: bulletColors[Math.floor(Math.random() * bulletColors.length)] });

    function distance(a,b) { return Math.hypot(a.x-b.x,a.y-b.y); }

    function end(win) {
      running = false;
      touchControls.classList.remove('active'); keys.clear();
      panel.innerHTML = win ? '<h1>WVUSD 被击败了！</h1><p>你成功把所有作业都干掉了！</p><p>彩蛋：<a href="https://wvusdorg.pages.dev" target="_blank" rel="noopener noreferrer">wvusdorg.pages.dev</a></p><button id="start">再战一次</button>' : '<h1>战斗结束</h1><p>老师发现你用chatGPT了，再接再厉!</p><button id="start">重新挑战</button>';
      overlay.style.display = 'grid'; document.querySelector('#start').onclick = start;
    }
    function updateLaser(dt) {
      if(ultimateActive){laser.phase='idle';laser.shake=0;goguardianToast.classList.remove('show');return;}
      if (laser.phase==='idle') {
        laser.cooldown-=dt;
        if(laser.cooldown<=0){laser.phase='warning';laser.t=0;goguardianToast.classList.add('show');}
        return;
      }
      laser.t+=dt;
      if(laser.phase==='warning' && laser.t>=.65){laser.phase='beam';laser.t=0;}
      else if(laser.phase==='beam' && laser.t>=1.75){
        laser.phase='idle';laser.t=0;laser.cooldown=7+Math.random()*3;laser.shake=0;
        goguardianToast.classList.remove('show');
      }
    }
    function laserWidth() {
      if(laser.phase!=='beam') return 0;
      const t=laser.t;
      if(t<.48) return 332*(t/.48);
      if(t<.78) return 332;
      return 332-(166*((t-.78)/.97));
    }
    function update(dt) {
      if(powerMode && ultimateUnlocked && (keys.has(' ')||keys.has('Spacebar'))){
        if(!ultimateActive){ultimateActive=true;laser.phase='idle';laser.cooldown=Infinity;goguardianToast.classList.remove('show');}
        ultimateShotClock-=dt;
        if(ultimateShotClock<=0){
          const angle=Math.atan2(boss.y-player.y,boss.x-player.x);
          ultimateShots.push({x:player.x,y:player.y,vx:Math.cos(angle)*520,vy:Math.sin(angle)*520,dead:false});
          ultimateShotClock=.3;
        }
      } else ultimateShotClock=Math.max(0,ultimateShotClock-dt);
      updateLaser(dt);
      if(laser.phase==='idle' && boss.turn) {
        const turn=boss.turn; turn.time+=dt;
        const p=Math.min(1,turn.time/turn.duration), eased=p*p*(3-2*p);
        // Brake, tiny recoil, then smoothly accelerate in the opposite direction.
        boss.vx=turn.fromDir*boss.speed*(1-2*eased) - turn.fromDir*32*Math.sin(Math.PI*p);
        boss.y=boss.baseY-Math.sin(Math.PI*p)*5;
        if(p>=1){boss.dir=-turn.fromDir;boss.vx=boss.dir*boss.speed;boss.turn=null;boss.turnWait=2+Math.random()*3;boss.y=boss.baseY;}
      } else if(laser.phase==='idle') {
        boss.turnWait-=dt;
        if(boss.turnWait<=0){boss.turn={time:0,duration:.82,fromDir:boss.dir};}
      }
      if(laser.phase==='idle') boss.x += boss.vx * dt;
      if (laser.phase==='idle' && (boss.x < 170 || boss.x > W - 170)) {
        boss.x=Math.max(170,Math.min(W-170,boss.x)); boss.dir=boss.x<=170?1:-1; boss.vx=boss.dir*boss.speed;
        boss.turn=null; boss.turnWait=2+Math.random()*3; boss.y=boss.baseY;
      }
      const up=keys.has('ArrowUp')||keys.has('w')||keys.has('W'), left=keys.has('ArrowLeft')||keys.has('a')||keys.has('A'), right=keys.has('ArrowRight')||keys.has('d')||keys.has('D'), down=keys.has('ArrowDown')||keys.has('s')||keys.has('S');
      let dx=(right?1:0)-(left?1:0), dy=0;
      player.defending=down; player.rolling=Math.max(0,player.rolling-dt); player.rollCooldown=Math.max(0,player.rollCooldown-dt);
      if (player.defending) { dx=0; player.rolling=0; }
      startRollIfChord();
      if (player.rolling>0) {
        player.trailClock-=dt;
        if(player.trailClock<=0){player.trails.push({x:player.x,y:player.y,rotation:player.rotation,life:.22});player.trailClock=.045;}
      } else player.trailClock=0;
      player.trails.forEach(t=>t.life-=dt); player.trails=player.trails.filter(t=>t.life>0);
      if (dx || dy) {
        const m=Math.hypot(dx,dy), mx=dx/m, my=dy/m;
        const rolling=player.rolling>0, moveX=rolling?player.rollX:mx, moveY=rolling?player.rollY:my;
        const travel=player.speed*(rolling?1.5:1)*dt;
        player.x += moveX*travel; player.y += moveY*travel;
        // Wheel roll: rotation follows distance travelled, reversing when moving back.
        const rollSign = moveX !== 0 ? Math.sign(moveX) : -Math.sign(moveY);
        player.rotation += rollSign * travel / player.r;
      }
      player.x=Math.max(player.r+7,Math.min(W-player.r-7,player.x)); player.y=Math.max(player.r+7,Math.min(H-player.r-7,player.y)); player.flash=Math.max(0,player.flash-dt);
      const beamWidth=laserWidth();
      laser.shake=laser.phase==='beam' ? .8+Math.random()*1.2 : 0;
      if(beamWidth>0 && Math.abs(player.x-boss.x)<beamWidth/2+player.r && !player.defending && player.rolling<=0) end(false);
      attackClock -= dt; if (attackClock <= 0) { fireRing(); attackClock = powerMode?.125:.25; }
      toastClock -= dt; if (toastClock <= 0) { showClassroomToast(); toastClock = 2; }
      for (const b of bullets) {
        // Only reflected bullets home in; enemy shots keep their original randomized path.
        if (b.returned) {
          const targetDistance=Math.max(1,distance(b,boss));
          b.vx=(boss.x-b.x)/targetDistance*b.speed; b.vy=(boss.y-b.y)/targetDistance*b.speed;
        }
        b.x += b.vx*dt; b.y += b.vy*dt;
        if (!b.returned && distance(b,player) < b.r+player.r) {
          if (player.defending) b.dead=true;
          else if (player.rolling<=0) hit(b);
        }
        if (b.returned && distance(b,boss) < b.r+boss.r*.70) damage(b);
        if (b.x < -30 || b.x > W+30 || b.y < -30 || b.y > H+30) b.dead=true;
      }
      bullets=bullets.filter(b=>!b.dead);
      for(const shot of ultimateShots){
        const targetDistance=Math.max(1,Math.hypot(boss.x-shot.x,boss.y-shot.y));
        shot.vx=(boss.x-shot.x)/targetDistance*520;shot.vy=(boss.y-shot.y)/targetDistance*520;
        shot.x+=shot.vx*dt;shot.y+=shot.vy*dt;
        if(Math.hypot(shot.x-boss.x,shot.y-boss.y)<boss.r*.7){shot.dead=true;hp=Math.max(0,hp-2);hpFill.style.width=(hp/maxHp*100)+'%';hpText.textContent=`HP ${hp} / ${maxHp}`;if(hp===0)end(true);}
        if(shot.x<-20||shot.x>W+20||shot.y<-20||shot.y>H+20)shot.dead=true;
      }
      ultimateShots=ultimateShots.filter(s=>!s.dead);
      sparks.forEach(s=>{s.x+=s.vx*dt;s.y+=s.vy*dt;s.life-=dt;}); sparks=sparks.filter(s=>s.life>0);
    }
    function drawBackground() {
      ctx.clearRect(0,0,W,H);
      const g=ctx.createLinearGradient(0,0,0,H); g.addColorStop(0,'#18284a');g.addColorStop(.53,'#192b35');g.addColorStop(.54,'#1d4233');g.addColorStop(1,'#0c201b');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
      ctx.fillStyle='#87a7d0'; for(let i=0;i<75;i++){ const x=(i*137)%W,y=(i*71)%310; ctx.globalAlpha=.16+(i%3)*.12;ctx.fillRect(x,y,2,2); } ctx.globalAlpha=1;
      ctx.fillStyle='#123126';ctx.beginPath();ctx.ellipse(W/2,H+20,W*.75,H*.40,0,0,Math.PI*2);ctx.fill();
    }
    function drawBoss() {
      ctx.save(); ctx.translate(boss.x,boss.y);
      ctx.beginPath();ctx.ellipse(0,76,130,21,0,0,Math.PI*2);ctx.fillStyle='#05091088';ctx.fill();
      if (tree.complete && tree.naturalWidth) ctx.drawImage(tree,-166,-120,332,246);
      else { // graceful fallback if the supplied local image has moved
        ctx.fillStyle='#4b2706';ctx.fillRect(-26,-14,52,135);ctx.beginPath();ctx.arc(0,-30,104,0,Math.PI*2);ctx.fillStyle='#20920d';ctx.fill();
      }
      ctx.restore();
    }
    function drawLaser() {
      const width=laserWidth(); if(width<=0) return;
      const jitterX=(Math.random()-.5)*1.2, jitterW=(Math.random()-.5)*1;
      const left=boss.x-width/2+jitterX, beamW=width+jitterW, top=boss.y+35, height=H-top;
      ctx.save();
      // Crisp nested bands keep the beam luminous without a large blurry halo.
      ctx.fillStyle='rgba(35,145,255,.18)'; ctx.fillRect(left,top,beamW,height);
      ctx.fillStyle='rgba(77,183,255,.55)'; ctx.fillRect(boss.x-beamW*.38+jitterX,top,beamW*.76,height);
      ctx.fillStyle='rgba(186,235,255,.94)'; ctx.fillRect(boss.x-beamW*.24+jitterX,top,beamW*.48,height);
      ctx.fillStyle='#fff'; ctx.fillRect(boss.x-beamW*.16+jitterX,top,beamW*.32,height);
      ctx.restore();
    }
    function drawPlayer() {
      // Trail ghosts live in canvas/world space, so rotating the live player never rotates them.
      for (const t of player.trails) {
        ctx.save(); ctx.globalAlpha=Math.min(.34,t.life*1.5); ctx.translate(t.x,t.y);
        if(playerImage.complete&&playerImage.naturalWidth) ctx.drawImage(playerImage,-32,-32,64,64);
        else {ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(0,0,25,0,Math.PI*2);ctx.fill();}
        ctx.restore();
      }
      ctx.save(); ctx.translate(player.x, player.y); ctx.rotate(player.rotation);
      if (player.flash) { ctx.shadowColor='#fff'; ctx.shadowBlur=18; }
      if (player.defending) { ctx.strokeStyle='#72d8ff'; ctx.lineWidth=4; ctx.beginPath(); ctx.arc(0,0,34,0,Math.PI*2); ctx.stroke(); }
      if (player.rolling>0) { ctx.globalAlpha=.72; }
      if (playerImage.complete && playerImage.naturalWidth) ctx.drawImage(playerImage, -32, -32, 64, 64);
      else { ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(0,0,25,0,Math.PI*2); ctx.fill(); }
      ctx.restore();
    }
    function getBulletSprite(color) {
      if (bulletSprites.has(color)) return bulletSprites.get(color);
      const tile = document.createElement('canvas'); tile.width = tile.height = 30;
      const t = tile.getContext('2d', { willReadFrequently: true });
      t.drawImage(bulletImage, 0, 0, 30, 30);
      // Recolour only near-white pixels in the supplied image; the grey icon remains intact.
      const pixels = t.getImageData(0, 0, 30, 30), data = pixels.data;
      const rgb = color.match(/[\da-f]{2}/gi).map(v => parseInt(v, 16));
      for(let i=0;i<data.length;i+=4) if(data[i] > 235 && data[i+1] > 235 && data[i+2] > 235 && data[i+3] > 0){ data[i]=rgb[0]; data[i+1]=rgb[1]; data[i+2]=rgb[2]; }
      t.putImageData(pixels,0,0); bulletSprites.set(color,tile); return tile;
    }
    function draw() {
      drawBackground();
      ctx.save(); if(laser.shake) ctx.translate((Math.random()-.5)*laser.shake,(Math.random()-.5)*laser.shake);
      drawLaser(); drawBoss();
      for(const shot of ultimateShots){
        const d=Math.max(1,Math.hypot(shot.vx,shot.vy)),ux=shot.vx/d,uy=shot.vy/d;
        ctx.save();ctx.lineCap='round';ctx.shadowColor='#ff8a24';ctx.shadowBlur=9;ctx.strokeStyle='#ff9a35';ctx.lineWidth=7;ctx.beginPath();ctx.moveTo(shot.x-ux*20,shot.y-uy*20);ctx.lineTo(shot.x+ux*5,shot.y+uy*5);ctx.stroke();
        ctx.shadowBlur=2;ctx.strokeStyle='#fff0b0';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(shot.x-ux*18,shot.y-uy*18);ctx.lineTo(shot.x+ux*4,shot.y+uy*4);ctx.stroke();ctx.restore();
      }
      for(const b of bullets){
        ctx.save(); ctx.translate(b.x,b.y);
        if(b.returned){ ctx.shadowColor='#ff3c46'; ctx.shadowBlur=15; }
        try {
          if (bulletImage.complete && bulletImage.naturalWidth) ctx.drawImage(getBulletSprite(b.color),-15,-15);
          else throw new Error('bullet image is not ready');
        } catch (error) {
        // Visible 30px fallback while local image access is unavailable.
        ctx.fillStyle=b.color; ctx.beginPath(); ctx.arc(0,0,15,0,Math.PI*2); ctx.fill(); ctx.strokeStyle='#555';ctx.lineWidth=2;ctx.stroke();
        ctx.fillStyle='#555';ctx.font='20px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('▤',0,0);
        }
        if(b.returned){ctx.strokeStyle='#ff7a7a';ctx.lineWidth=2;ctx.beginPath();ctx.arc(0,0,16,0,Math.PI*2);ctx.stroke();}
        ctx.restore();
      }
      for(const s of sparks){ctx.globalAlpha=Math.min(1,s.life*3);ctx.fillStyle=s.color;ctx.fillRect(s.x-2,s.y-2,4,4);}ctx.globalAlpha=1;
      drawPlayer();
      // Draw the hero last and on a HUD layer so the boss art/projectiles can never hide it.
      drawPlayer();
      if(running){ctx.fillStyle='#e7f5ff';ctx.font='700 13px Microsoft YaHei';ctx.textAlign='center';ctx.fillText('把作业反弹回 WVUSD！',player.x,player.y+43);}
      ctx.restore();
    }
    function loop(now) { if (!running) return; const dt=Math.min(.035,(now-last)/1000);last=now; update(dt);draw();requestAnimationFrame(loop); }
    draw();
  })();
  </script>
